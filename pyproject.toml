[project]
name = "gbensh"
version = "0.1.0"
license = "Apache-2.0"

requires-python = ">=3.10,<3.11"

dependencies = [
    "torch==2.5.1",
    "torch-geometric==2.8.0",
    "ogb==1.3.6",
]


[tool.uv.sources]
torch = { index = "pytorch-cu121" }


[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[project.scripts]
gbensh = "gbensh:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gbensh"]

[tool.setuptools.packages.find]
include = ["engine*"]

